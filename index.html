    <style>
      /* Scrollbar sutil y transparente (global) */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.32);
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
      }

      @media print {
        @page {
          size: A4 portrait;
          margin: 10mm 12mm;
        }

        *, *::before, *::after {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        html, body {
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          color: #111827 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* Ocultar elementos no imprimibles */
        .no-print,
        .print\:hidden,
        [role="dialog"] > header,
        body > #root > div > div:first-child,
        body > #root > div > footer {
          display: none !important;
        }

        /* Resetear contenedores del modal para que no generen cajas ni scroll */
        .modal-overlay,
        .modal-container,
        .modal-body,
        .fixed,
        [role="dialog"] {
          position: static !important;
          inset: auto !important;
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          background: transparent !important;
          box-shadow: none !important;
          border: none !important;
          padding: 0 !important;
          margin: 0 !important;
          backdrop-filter: none !important;
        }

        #catalog-to-print {
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
          box-shadow: none !important;
          border: none !important;
          background: transparent !important;
          display: block !important;
        }

        /* Hojas físicas A4 calibradas milimétricamente */
        .catalog-page {
          box-sizing: border-box !important;
          width: 100% !important;
          min-height: 265mm !important;
          max-height: 275mm !important;
          height: 270mm !important;
          display: flex !important;
          flex-direction: column !important;
          justify-content: space-between !important;
          page-break-after: always !important;
          break-after: page !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          background: #ffffff !important;
        }

        .catalog-page:last-child {
          page-break-after: avoid !important;
          break-after: avoid !important;
        }
        
        /* Cuadrícula de 3 columnas estable para WebKit y Gecko */
        .catalog-page .grid {
          display: grid !important;
          grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
          gap: 4mm !important;
          flex-grow: 1 !important;
          align-content: start !important;
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }
        
        /* Tarjeta de producto en impresión */
        .catalog-page article,
        .catalog-page .grid > * {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
          border: 1px solid #e5e7eb !important;
          box-shadow: none !important;
          background: #ffffff !important;
        }

        .catalog-page img {
          max-height: 100% !important;
          object-fit: cover !important;
        }
      }

      /* Basic Tooltip Styles */
      [data-tooltip-id="kpi-tooltip"] {
        position: relative;
        cursor: help;
      }
      [data-tooltip-id="kpi-tooltip"]::after {
        content: attr(data-tooltip-content);
        position: absolute;
        bottom: 125%; /* Position above the icon */
        right: 50%;
        transform: translateX(50%);
        background-color: #1f2937; /* bg-gray-800 */
        color: #d1d5db; /* text-gray-300 */
        border: 1px solid #4b5563; /* border-gray-600 */
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem; /* rounded-lg */
        font-size: 0.75rem; /* text-xs */
        line-height: 1.25;
        white-space: pre-wrap;
        width: max-content;
        max-width: 250px;
        text-align: center;
        z-index: 10;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease-in-out, visibility 0.2s ease-in-out;
        pointer-events: none;
      }
      [data-tooltip-id="kpi-tooltip"]:hover::after {
        opacity: 1;
        visibility: visible;
      }
      
      .kpi-carousel::-webkit-scrollbar {
        display: none;
      }
      .kpi-carousel {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

    </style>
